<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIE AS Physics 9702 - Syllabus (Topics 1-11)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.watermark {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 2000;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #efe9e1;
  color: #5b534c;
  line-height: 1.6;
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 2px solid #e2d9cc;
}
.header h1 {
  font-size: 24px;
  font-weight: 800;
  color: #4a433c;
  margin-bottom: 6px;
}
.header p {
  color: #a89e90;
  font-size: 13px;
}
.topic-card {
  background: #fbf8f4;
  border-radius: 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(91,83,76,0.08);
  overflow: hidden;
  border: 1px solid #e6ded2;
}
.topic-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.topic-header:hover {
  background: #f4efe7;
}
.topic-num {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}
.topic-info { flex: 1; }
.topic-name {
  font-size: 15px;
  font-weight: 700;
  color: #4a433c;
}
.topic-count {
  font-size: 12px;
  color: #a89e90;
  margin-top: 2px;
}
.topic-count .q-count {
  color: #7c8fa0;
  font-weight: 700;
}
.chevron {
  font-size: 13px;
  color: #b5aa9b;
  transition: transform 0.2s;
}
.topic-card.expanded .chevron {
  transform: rotate(180deg);
}
.sub-list {
  display: none;
  padding: 0 20px 16px 20px;
}
.topic-card.expanded .sub-list {
  display: block;
}
.sub-card {
  background: #f4efe7;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-left: 3px solid #d6cbba;
}
.sub-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.sub-code {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sub-name {
  font-size: 14px;
  font-weight: 600;
  color: #6b6154;
}
.subsub-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.subsub-item {
  display: flex;
  flex-direction: column;
  padding: 8px 12px;
  background: #fbf8f4;
  border-radius: 8px;
  border: 1px solid #e6ded2;
}
.subsub-item.clickable {
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.subsub-item.clickable:hover {
  border-color: #b9c8d1;
  background: #f4efe7;
}
.subsub-item-hot {
  background: #f6efe1;
  border-color: #d9bd8c;
}
.subsub-item-hot.clickable:hover {
  border-color: #c39a5f;
  background: #f1e6d0;
}
.subsub-item-superhot {
  background: #f3e6e0;
  border: 1.5px solid #c0846b;
  box-shadow: 0 0 0 3px #ecd7cd;
}
.subsub-item-superhot .subsub-desc {
  font-weight: 700;
  color: #8a5442;
}
.subsub-item-superhot.clickable:hover {
  border-color: #a8624c;
  background: #eeddd3;
}
.subsub-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.subsub-code {
  font-size: 11px;
  font-weight: 700;
  color: #a89e90;
  background: #f0eae1;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 1px;
}
.subsub-desc {
  font-size: 13px;
  color: #6b6154;
  line-height: 1.5;
  flex: 1;
}
.subsub-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
  background: #e6ded2;
  color: #a89e90;
  flex-shrink: 0;
  margin-top: 1px;
}
.subsub-badge.active {
  background: #8497a8;
  color: white;
}
.subsub-badge-hot {
  background: #c39a5f !important;
  color: white;
}
.subsub-badge-superhot {
  background: #a8624c !important;
  color: white;
  box-shadow: 0 0 0 2px #e3c3b8;
}
.question-panel {
  display: none;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #e2d9cc;
}
.question-panel.open {
  display: flex;
}
.q-card {
  background: #f7f3ec;
  border-radius: 10px;
  padding: 14px;
  border: 1px solid #e6ded2;
}
.q-meta {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.q-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 6px;
  font-weight: 700;
}
.q-tag.paper { background: #dde6ea; color: #5c7a8a; }
.q-tag.qnum { background: #dfe6d3; color: #63764c; }
.q-tag.multi { background: #f0e4c4; color: #93743f; }
.q-card-multi {
  border: 1.5px solid #c9a24a;
  box-shadow: 0 0 0 3px #f0e4c4;
}
.q-paper-full {
  font-size: 12px;
  color: #a89e90;
  margin-bottom: 10px;
}
.answer-row {
  margin-bottom: 10px;
}
.answer-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid #b9c8d1;
  background: #eef3f6;
  color: #5c7a8a;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.answer-btn:hover {
  background: #dde6ea;
  border-color: #8497a8;
}
.answer-reveal {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 13px;
  color: #5c7a8a;
}
.answer-reveal.shown {
  display: flex;
}
.answer-reveal .answer-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #7c8fa0;
  color: white;
  font-weight: 800;
  font-size: 13px;
}
.answer-reveal .answer-na {
  color: #a89e90;
  font-style: italic;
}
.q-related {
  font-size: 11px;
  color: #a89e90;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.q-related-tag {
  font-size: 11px;
  font-weight: 700;
  color: #7c5f80;
  background: #e9e0eb;
  padding: 2px 7px;
  border-radius: 4px;
}
.q-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding-bottom: 4px;
  margin-bottom: 4px;
  border-bottom: 1px dashed #e2d9cc;
}
.q-pager-btn {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #8497a8;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.q-pager-btn:hover:not(:disabled) {
  background: #e7edf0;
  border-color: #b9c8d1;
}
.q-pager-btn:disabled {
  color: #d3cabc;
  cursor: not-allowed;
}
.q-pager-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.q-pager-tab {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #a89e90;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.3;
  position: relative;
}
.q-pager-tab-multi::after {
  content: '';
  position: absolute;
  top: -3px;
  right: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c9a24a;
  border: 1.5px solid #fbf8f4;
}
.q-pager-tab-q {
  font-size: 11px;
  font-weight: 700;
}
.q-pager-tab-season {
  font-size: 9px;
  font-weight: 600;
  opacity: 0.75;
}
.q-pager-tab:hover {
  border-color: #b9c8d1;
  color: #55697b;
}
.q-pager-tab.active {
  background: #8497a8;
  border-color: #8497a8;
  color: white;
}
.pdf-container {
  background: #fbf8f4;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  border: 1px solid #e6ded2;
  overflow: hidden;
}
.pdf-container embed {
  width: 100%;
  height: 460px;
  border-radius: 6px;
  border: none;
}
.pdf-fallback {
  padding: 30px;
  color: #a89e90;
  font-size: 13px;
}
.pdf-fallback a { color: #8497a8; text-decoration: none; font-weight: 600; }
.footer {
  text-align: center;
  margin-top: 32px;
  padding: 16px;
  color: #a89e90;
  font-size: 12px;
  border-top: 1px solid #e2d9cc;
}
.t1 .topic-num { background: #8fa3ad; } .t1 .sub-card { border-left-color: #b7c6cc; } .t1 .sub-code { color: #5c7a8a; background: #e2eaed; }
.t2 .topic-num { background: #93a382; } .t2 .sub-card { border-left-color: #bdc9ac; } .t2 .sub-code { color: #63764c; background: #e2e8d8; }
.t3 .topic-num { background: #c2a878; } .t3 .sub-card { border-left-color: #dcc9a3; } .t3 .sub-code { color: #93743f; background: #f0e4cc; }
.t4 .topic-num { background: #c08974; } .t4 .sub-card { border-left-color: #ddb4a1; } .t4 .sub-code { color: #935f49; background: #f0ddd3; }
.t5 .topic-num { background: #ba8c95; } .t5 .sub-card { border-left-color: #ddb7bd; } .t5 .sub-code { color: #8c5c66; background: #efdde0; }
.t6 .topic-num { background: #9891ab; } .t6 .sub-card { border-left-color: #c1bcd0; } .t6 .sub-code { color: #675f80; background: #e5e1ec; }
.t7 .topic-num { background: #7fa39a; } .t7 .sub-card { border-left-color: #b1cac2; } .t7 .sub-code { color: #517167; background: #dce9e4; }
.t8 .topic-num { background: #a084a0; } .t8 .sub-card { border-left-color: #c9b0c8; } .t8 .sub-code { color: #715170; background: #ebdcea; }
.t9 .topic-num { background: #c39468; } .t9 .sub-card { border-left-color: #ddbc95; } .t9 .sub-code { color: #93693c; background: #f0e1cc; }
.t10 .topic-num { background: #a3a578; } .t10 .sub-card { border-left-color: #c6c8a2; } .t10 .sub-code { color: #75773f; background: #eaebd5; }
.t11 .topic-num { background: #8497a8; } .t11 .sub-card { border-left-color: #b6c2cc; } .t11 .sub-code { color: #55697b; background: #e0e6ea; }.paper-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.paper-tab {
  flex: 1;
  padding: 10px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 10px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #a89e90;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.paper-tab:hover {
  border-color: #b9c8d1;
}
.paper-tab.active {
  background: #7c8fa0;
  border-color: #7c8fa0;
  color: white;
}
.paper-panel {
  display: none;
}
.paper-panel.active {
  display: block;
}
.coming-soon {
  text-align: center;
  padding: 60px 20px;
  color: #a89e90;
  font-size: 14px;
  background: #fbf8f4;
  border-radius: 14px;
  border: 1px solid #e6ded2;
}

<script>
document.querySelectorAll('.paper-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.paper-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.paper-panel').forEach(function(p) { p.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById('paper' + tab.dataset.paper + '-panel').classList.add('active');
  });
});
</script>

// ---- Build pdf -> all related learning-objective codes map, used to show "also covers" on question cards ----
const pdfToCodes = {};
Object.keys(questionData).forEach(function(code) {
  questionData[code].forEach(function(q) {
    if (!pdfToCodes[q.pdf]) pdfToCodes[q.pdf] = [];
    if (pdfToCodes[q.pdf].indexOf(code) === -1) pdfToCodes[q.pdf].push(code);
  });
});

// ---- Parse a short season+year label (e.g. Jun25) from a paper string like 9702/13/O/N/25 ----
function seasonLabel(paperStr) {
  var parts = paperStr.split('/');
  if (parts.length < 4) return '';
  var year = parts[parts.length - 1];
  var session = parts.slice(2, parts.length - 1).join('/');
  var map = { 'M/J': 'Jun', 'O/N': 'Nov', 'F/M': 'Mar' };
  return (map[session] || session) + year;
}

          let tabs = sortedQList.map(function(q, idx) {
            var tab = document.createElement('button');
            var totalCodes = (pdfToCodes[q.pdf] || []).length;
            tab.className = 'q-pager-tab' + (totalCodes >= 3 ? ' q-pager-tab-multi' : '');
            tab.type = 'button';
            tab.innerHTML = '<span class="q-pager-tab-q">' + q.qnum + '</span><span class="q-pager-tab-season">' + seasonLabel(q.paper) + '</span>';
            tab.addEventListener('click', function(e) {
              e.stopPropagation();
              pageIdx = idx;
              renderPage();
            });
            tabsWrap.appendChild(tab);
            return tab;
          });

          let nextBtn = document.createElement('button');
          nextBtn.className = 'q-pager-btn';
          nextBtn.type = 'button';
          nextBtn.innerHTML = '&#8250;';

          const renderPage = function() {
            qCards.forEach(function(c, idx) {
              c.style.display = idx === pageIdx ? 'block' : 'none';
            });
            tabs.forEach(function(tab, idx) {
              tab.classList.toggle('active', idx === pageIdx);
            });
            prevBtn.disabled = pageIdx === 0;
            nextBtn.disabled = pageIdx === qCards.length - 1;
          };

          prevBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (pageIdx > 0) { pageIdx--; renderPage(); }
          });
          nextBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (pageIdx < qCards.length - 1) { pageIdx++; renderPage(); }
          });

          pager.appendChild(prevBtn);
          pager.appendChild(tabsWrap);
          pager.appendChild(nextBtn);
          panel.insertBefore(pager, panel.firstChild);

          renderPage();
        }


        item.appendChild(panel);
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          panel.classList.toggle('open');
        });
      }

      subsubList.appendChild(item);
    }

    subCard.appendChild(subHeader);
    subCard.appendChild(subsubList);
    subList.appendChild(subCard);
  }

  card.appendChild(header);
  card.appendChild(subList);
  container.appendChild(card);
});
</script>

</body>
</html>
