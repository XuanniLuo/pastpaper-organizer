<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9702 - paper2025 organizer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.watermark {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 2000;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #efe9e1;
  color: #5b534c;
  line-height: 1.6;
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 2px solid #e2d9cc;
}
.header h1 {
  font-size: 24px;
  font-weight: 800;
  color: #4a433c;
  margin-bottom: 6px;
}
.header p {
  color: #a89e90;
  font-size: 13px;
}
.topic-card {
  background: #fbf8f4;
  border-radius: 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(91,83,76,0.08);
  overflow: hidden;
  border: 1px solid #e6ded2;
}
.topic-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.topic-header:hover {
  background: #f4efe7;
}
.topic-num {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}
.topic-info { flex: 1; }
.topic-name {
  font-size: 15px;
  font-weight: 700;
  color: #4a433c;
}
.topic-count {
  font-size: 12px;
  color: #a89e90;
  margin-top: 2px;
}
.topic-count .q-count {
  color: #7c8fa0;
  font-weight: 700;
}
.chevron {
  font-size: 13px;
  color: #b5aa9b;
  transition: transform 0.2s;
}
.topic-card.expanded .chevron {
  transform: rotate(180deg);
}
.sub-list {
  display: none;
  padding: 0 20px 16px 20px;
}
.topic-card.expanded .sub-list {
  display: block;
}
.sub-card {
  background: #f4efe7;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-left: 3px solid #d6cbba;
}
.sub-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.sub-code {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sub-name {
  font-size: 14px;
  font-weight: 600;
  color: #6b6154;
}
.subsub-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.subsub-item {
  display: flex;
  flex-direction: column;
  padding: 8px 12px;
  background: #fbf8f4;
  border-radius: 8px;
  border: 1px solid #e6ded2;
}
.subsub-item.clickable {
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.subsub-item.clickable:hover {
  border-color: #b9c8d1;
  background: #f4efe7;
}
.subsub-item-hot {
  background: #f6efe1;
  border-color: #d9bd8c;
}
.subsub-item-hot.clickable:hover {
  border-color: #c39a5f;
  background: #f1e6d0;
}
.subsub-item-superhot {
  background: #f3e6e0;
  border: 1.5px solid #c0846b;
  box-shadow: 0 0 0 3px #ecd7cd;
}
.subsub-item-superhot .subsub-desc {
  font-weight: 700;
  color: #8a5442;
}
.subsub-item-superhot.clickable:hover {
  border-color: #a8624c;
  background: #eeddd3;
}
.subsub-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.subsub-code {
  font-size: 11px;
  font-weight: 700;
  color: #a89e90;
  background: #f0eae1;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 1px;
}
.subsub-desc {
  font-size: 13px;
  color: #6b6154;
  line-height: 1.5;
  flex: 1;
}
.subsub-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
  background: #e6ded2;
  color: #a89e90;
  flex-shrink: 0;
  margin-top: 1px;
}
.subsub-badge.active {
  background: #8497a8;
  color: white;
}
.subsub-badge-hot {
  background: #c39a5f !important;
  color: white;
}
.subsub-badge-superhot {
  background: #a8624c !important;
  color: white;
  box-shadow: 0 0 0 2px #e3c3b8;
}
.question-panel {
  display: none;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed #e2d9cc;
}
.question-panel.open {
  display: flex;
}
.q-card {
  background: #f7f3ec;
  border-radius: 10px;
  padding: 14px;
  border: 1px solid #e6ded2;
}
.q-meta {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.q-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 6px;
  font-weight: 700;
}
.q-tag.paper { background: #dde6ea; color: #5c7a8a; }
.q-tag.qnum { background: #dfe6d3; color: #63764c; }
.q-tag.multi { background: #f0e4c4; color: #93743f; }
.diff-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 6px;
  color: white;
  flex-shrink: 0;
  cursor: help;
}
.diff-badge.diff-easy { background: #6ea36e; }
.diff-badge.diff-medium { background: #d9a441; }
.diff-badge.diff-difficult { background: #c0594a; }
.diff-badge.diff-estimated { border: 1.5px dashed rgba(255,255,255,0.85); }
.q-card-multi {
  border: 1.5px solid #c9a24a;
  box-shadow: 0 0 0 3px #f0e4c4;
}
.q-paper-full {
  font-size: 12px;
  color: #a89e90;
  margin-bottom: 10px;
}
.answer-row {
  margin-bottom: 10px;
}
.answer-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid #b9c8d1;
  background: #eef3f6;
  color: #5c7a8a;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.answer-btn:hover {
  background: #dde6ea;
  border-color: #8497a8;
}
.answer-reveal {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 13px;
  color: #5c7a8a;
}
.answer-reveal.shown {
  display: flex;
}
.answer-reveal .answer-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #7c8fa0;
  color: white;
  font-weight: 800;
  font-size: 13px;
}
.answer-reveal .answer-na {
  color: #a89e90;
  font-style: italic;
}
.q-related {
  font-size: 11px;
  color: #a89e90;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.q-related-tag {
  font-size: 11px;
  font-weight: 700;
  color: #7c5f80;
  background: #e9e0eb;
  padding: 2px 7px;
  border-radius: 4px;
}
.q-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding-bottom: 4px;
  margin-bottom: 4px;
  border-bottom: 1px dashed #e2d9cc;
}
.q-pager-btn {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #8497a8;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.q-pager-btn:hover:not(:disabled) {
  background: #e7edf0;
  border-color: #b9c8d1;
}
.q-pager-btn:disabled {
  color: #d3cabc;
  cursor: not-allowed;
}
.q-pager-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.q-pager-tab {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #a89e90;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.3;
  position: relative;
}
.q-pager-tab-multi::after {
  content: '';
  position: absolute;
  top: -3px;
  right: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c9a24a;
  border: 1.5px solid #fbf8f4;
}
.q-pager-tab-q {
  font-size: 11px;
  font-weight: 700;
}
.q-pager-tab-season {
  font-size: 9px;
  font-weight: 600;
  opacity: 0.75;
}
.q-pager-tab:hover {
  border-color: #b9c8d1;
  color: #55697b;
}
.q-pager-tab.active {
  background: #8497a8;
  border-color: #8497a8;
  color: white;
}
.pdf-container {
  background: #fbf8f4;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  border: 1px solid #e6ded2;
  overflow: hidden;
}
.pdf-container embed {
  width: 100%;
  height: 460px;
  border-radius: 6px;
  border: none;
}
.pdf-fallback {
  padding: 30px;
  color: #a89e90;
  font-size: 13px;
}
.pdf-fallback a { color: #8497a8; text-decoration: none; font-weight: 600; }
.footer {
  text-align: center;
  margin-top: 32px;
  padding: 16px;
  color: #a89e90;
  font-size: 12px;
  border-top: 1px solid #e2d9cc;
}
.t1 .topic-num { background: #8fa3ad; } .t1 .sub-card { border-left-color: #b7c6cc; } .t1 .sub-code { color: #5c7a8a; background: #e2eaed; }
.t2 .topic-num { background: #93a382; } .t2 .sub-card { border-left-color: #bdc9ac; } .t2 .sub-code { color: #63764c; background: #e2e8d8; }
.t3 .topic-num { background: #c2a878; } .t3 .sub-card { border-left-color: #dcc9a3; } .t3 .sub-code { color: #93743f; background: #f0e4cc; }
.t4 .topic-num { background: #c08974; } .t4 .sub-card { border-left-color: #ddb4a1; } .t4 .sub-code { color: #935f49; background: #f0ddd3; }
.t5 .topic-num { background: #ba8c95; } .t5 .sub-card { border-left-color: #ddb7bd; } .t5 .sub-code { color: #8c5c66; background: #efdde0; }
.t6 .topic-num { background: #9891ab; } .t6 .sub-card { border-left-color: #c1bcd0; } .t6 .sub-code { color: #675f80; background: #e5e1ec; }
.t7 .topic-num { background: #7fa39a; } .t7 .sub-card { border-left-color: #b1cac2; } .t7 .sub-code { color: #517167; background: #dce9e4; }
.t8 .topic-num { background: #a084a0; } .t8 .sub-card { border-left-color: #c9b0c8; } .t8 .sub-code { color: #715170; background: #ebdcea; }
.t9 .topic-num { background: #c39468; } .t9 .sub-card { border-left-color: #ddbc95; } .t9 .sub-code { color: #93693c; background: #f0e1cc; }
.t10 .topic-num { background: #a3a578; } .t10 .sub-card { border-left-color: #c6c8a2; } .t10 .sub-code { color: #75773f; background: #eaebd5; }
.t11 .topic-num { background: #8497a8; } .t11 .sub-card { border-left-color: #b6c2cc; } .t11 .sub-code { color: #55697b; background: #e0e6ea; }.paper-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.paper-tab {
  flex: 1;
  padding: 10px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 10px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #a89e90;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.paper-tab:hover {
  border-color: #b9c8d1;
}
.paper-tab.active {
  background: #7c8fa0;
  border-color: #7c8fa0;
  color: white;
}
.paper-panel {
  display: none;
}
.paper-panel.active {
  display: block;
}
.coming-soon {
  text-align: center;
  padding: 60px 20px;
  color: #a89e90;
  font-size: 14px;
  background: #fbf8f4;
  border-radius: 14px;
  border: 1px solid #e6ded2;
}

/* ---- Paper 2 (structured questions) ---- */
.p2-q-card {
  background: #f4efe7;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-left: 3px solid #d6cbba;
}
.p2-q-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
  cursor: pointer;
  user-select: none;
}
.p2-q-num {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 4px;
  flex-shrink: 0;
}
.p2-q-title {
  font-size: 14px;
  font-weight: 600;
  color: #6b6154;
  flex: 1;
}
.p2-q-marks {
  font-size: 11px;
  font-weight: 700;
  color: #a89e90;
  background: #e6ded2;
  padding: 2px 9px;
  border-radius: 20px;
  flex-shrink: 0;
}
.p2-q-meta {
  font-size: 12px;
  color: #a89e90;
  margin: 4px 0 10px 0;
}
.p2-chevron {
  font-size: 12px;
  color: #b5aa9b;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.p2-q-card.expanded .p2-chevron { transform: rotate(180deg); }
.p2-q-body {
  display: none;
  flex-direction: column;
  gap: 10px;
}
.p2-q-card.expanded .p2-q-body { display: flex; }
.p2-part {
  background: #fbf8f4;
  border-radius: 8px;
  padding: 10px 12px;
  border: 1px solid #e6ded2;
}
.p2-part-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.p2-part-label {
  font-size: 12px;
  font-weight: 800;
  color: #6b6154;
  background: #efe8db;
  padding: 2px 8px;
  border-radius: 6px;
  flex-shrink: 0;
}
.p2-part-marks {
  font-size: 10px;
  font-weight: 700;
  color: #a89e90;
  margin-left: auto;
  flex-shrink: 0;
}
.p2-part-codes {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.p2-code-chip {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 10px;
}
.p2-code-chip[data-tip] {
  position: relative;
  cursor: help;
}
.p2-code-chip[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%) translateY(4px);
  width: max-content;
  max-width: 260px;
  background: rgba(40, 36, 30, 0.82);
  backdrop-filter: blur(2px);
  color: #fdfaf4;
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.45;
  padding: 7px 10px;
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.22);
  white-space: normal;
  text-align: left;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
  z-index: 60;
}
.p2-code-chip[data-tip]::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 100%;
  transform: translateX(-50%) translateY(4px);
  border: 5px solid transparent;
  border-top-color: rgba(40, 36, 30, 0.82);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
  z-index: 60;
}
.p2-code-chip[data-tip]:hover::after,
.p2-code-chip[data-tip]:hover::before {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.p2-answer-btn {
  font-size: 11.5px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid #b9c8d1;
  background: #eef3f6;
  color: #5c7a8a;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.p2-answer-btn:hover { background: #dde6ea; border-color: #8497a8; }
.p2-answer-reveal {
  display: none;
  margin-top: 8px;
  padding: 10px 12px;
  background: #eef3f6;
  border-radius: 8px;
  border: 1px dashed #b9c8d1;
  font-size: 12.5px;
  color: #4a5f6e;
  line-height: 1.55;
}
.p2-answer-reveal.shown { display: block; }
.p2-answer-reveal b { color: #3d5464; }
.p2-q-body .q-pager-tab { padding: 5px 10px; }
.p2-part { display: none; }
.p2-pdf-wrap { display: block; margin-bottom: 10px; }

/* ---- Question marking (mark-as-done / tricky / hard) ---- */
.mark-toolbar {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  flex-shrink: 0;
  padding-left: 4px;
}
.mark-dot {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  padding: 0;
  opacity: 0.35;
  transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
}
.mark-dot:hover { opacity: 0.8; transform: scale(1.18); }
.mark-dot.active { opacity: 1; box-shadow: 0 0 0 2px #fbf8f4, 0 0 0 4px currentColor; }
.mark-dot.mark-green  { background: #6ea36e; color: #6ea36e; }
.mark-dot.mark-yellow { background: #d9a441; color: #d9a441; }
.mark-dot.mark-red    { background: #c0594a; color: #c0594a; }

.q-card.marked-green,   .p2-q-card.marked-green   { border-left: 4px solid #6ea36e; background: #eef4ea; }
.q-card.marked-yellow,  .p2-q-card.marked-yellow  { border-left: 4px solid #d9a441; background: #faf3e2; }
.q-card.marked-red,     .p2-q-card.marked-red     { border-left: 4px solid #c0594a; background: #f8ebe8; }

.mark-panel {
  position: sticky;
  top: 10px;
  z-index: 50;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  background: #fbf8f4;
  border: 1px solid #e6ded2;
  border-radius: 12px;
  padding: 10px 16px;
  margin-bottom: 16px;
  font-size: 12.5px;
  color: #6b6154;
  box-shadow: 0 1px 3px rgba(91,83,76,0.08);
}
.mark-panel-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mark-panel-legend span { display: flex; align-items: center; gap: 5px; }
.mark-legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.mark-legend-dot.mark-green  { background: #6ea36e; }
.mark-legend-dot.mark-yellow { background: #d9a441; }
.mark-legend-dot.mark-red    { background: #c0594a; }
.mark-panel-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.mark-panel-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid #b9c8d1;
  background: #eef3f6;
  color: #5c7a8a;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.mark-panel-btn:hover { background: #dde6ea; border-color: #8497a8; }
.mark-panel-btn.danger { border-color: #d3a99c; background: #f8ece7; color: #a8624c; }
.mark-panel-btn.danger:hover { background: #f3ddd3; border-color: #c0846b; }

/* ---- Question timer ---- */
.timer-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
  background: #e6ded2;
  color: #a89e90;
  flex-shrink: 0;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.timer-badge.timer-running {
  background: #dde6ea;
  color: #5c7a8a;
}
.timer-badge.timer-running::before {
  content: '';
  display: inline-block;

<script>
// ============================================================
// QUESTION MARKING — mark any question card green (done),
// yellow (error-prone) or red (hard). Marks persist
// in localStorage and can be exported/imported as JSON so they
// survive across browsers/devices or can be added later.
// ============================================================
const MARK_STORAGE_KEY = 'physicsQuestionMarks_v1';
const MARK_COLORS = [
  { key: 'green',  title: 'Mark: yes' },
  { key: 'yellow', title: 'Mark: hmmm' },
  { key: 'red',    title: 'Mark: not yet' }
];

let questionMarks = {};
try {
  questionMarks = JSON.parse(localStorage.getItem(MARK_STORAGE_KEY) || '{}') || {};
} catch (e) {
  questionMarks = {};
}

// Registry of every markable card so we can re-sync the UI after an import or a clear.
const markRegistry = [];

function persistMarks() {
  try { localStorage.setItem(MARK_STORAGE_KEY, JSON.stringify(questionMarks)); } catch (e) {}
  updateMarkStats();
  if (typeof renderDashboard === 'function') renderDashboard();
}

function applyCardMarkClass(cardEl, id) {
  cardEl.classList.remove('marked-green', 'marked-yellow', 'marked-red');
  var m = questionMarks[id];
  if (m) cardEl.classList.add('marked-' + m);
}

function syncToolbarDots(toolbarEl, id) {
  toolbarEl.querySelectorAll('.mark-dot').forEach(function(b) {
    b.classList.toggle('active', questionMarks[id] === b.getAttribute('data-mark'));
  });
}

// Build a small 3-dot toolbar for a given question id (its unique pdf filename) and
// wire it up so clicking a colour sets that mark, clicking the active colour again clears it.
function createMarkToolbar(id, cardEl) {
  var wrap = document.createElement('div');
  wrap.className = 'mark-toolbar';
  MARK_COLORS.forEach(function(c) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mark-dot mark-' + c.key;
    btn.title = c.title;
    btn.setAttribute('data-mark', c.key);
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      questionMarks[id] = (questionMarks[id] === c.key) ? undefined : c.key;
      if (!questionMarks[id]) delete questionMarks[id];
      syncToolbarDots(wrap, id);
      applyCardMarkClass(cardEl, id);
      persistMarks();
    });
    wrap.appendChild(btn);
  });
  return wrap;
}

// Call once per question card right after building its toolbar, so it's tracked for
// import/clear refreshes and gets its initial (possibly already-saved) mark applied.
function registerMarkable(id, cardEl, toolbarEl) {
  markRegistry.push({ id: id, cardEl: cardEl, toolbarEl: toolbarEl });
  applyCardMarkClass(cardEl, id);
  syncToolbarDots(toolbarEl, id);
}

function refreshAllMarks() {
  markRegistry.forEach(function(r) {
    applyCardMarkClass(r.cardEl, r.id);
    syncToolbarDots(r.toolbarEl, r.id);
  });
  updateMarkStats();
}

function updateMarkStats() {
  var counts = { green: 0, yellow: 0, red: 0 };
  Object.keys(questionMarks).forEach(function(id) {
    var c = questionMarks[id];
    if (counts.hasOwnProperty(c)) counts[c]++;
  });
  var g = document.getElementById('mark-count-green');
  var y = document.getElementById('mark-count-yellow');
  var r = document.getElementById('mark-count-red');
  if (g) g.textContent = counts.green;
  if (y) y.textContent = counts.yellow;
  if (r) r.textContent = counts.red;
}

function exportMarks() {
  var data = JSON.stringify(questionMarks, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var d = new Date();
  var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  a.download = 'question-marks-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importMarksFromFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var obj = JSON.parse(e.target.result);
      if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) throw new Error('bad format');
      // Merge on top of existing marks so importing doesn't wipe marks made on this device only.
      Object.keys(obj).forEach(function(id) {
        if (obj[id]) questionMarks[id] = obj[id];
      });
      persistMarks();
      refreshAllMarks();
    } catch (err) {
      alert('Import failed: invalid file format. Please select a marks JSON file exported from this page.');
    }
  };
  reader.readAsText(file);
}

// ============================================================
// QUESTION TIMER — starts counting the moment a question is
// opened (expanded / its panel shown) and pauses the moment it's
// closed. Only one question times at once; opening a new one
// automatically pauses whichever was running before. Elapsed
// time accumulates per question id (its unique pdf filename) and
// persists in localStorage across reloads.
// ============================================================
const TIMER_STORAGE_KEY = 'physicsQuestionTimers_v1';
let questionTimers = {};
try {
  questionTimers = JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY) || '{}') || {};
} catch (e) {
  questionTimers = {};
}

const timerBadgeRegistry = {}; // id -> array of badge elements showing this id's time
let activeTimerId = null;
let activeTimerStart = null;
let timerTickHandle = null;

function formatElapsed(ms) {
  var totalSec = Math.max(0, Math.floor(ms / 1000));
  var m = Math.floor(totalSec / 60);
  var s = totalSec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function persistTimers() {
  try { localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify(questionTimers)); } catch (e) {}
}

function currentElapsed(id) {
  var ms = questionTimers[id] || 0;
  if (id === activeTimerId && activeTimerStart) ms += (Date.now() - activeTimerStart);
  return ms;
}

function refreshTimerBadges(id) {
  var ms = currentElapsed(id);
  (timerBadgeRegistry[id] || []).forEach(function(b) {
    b.textContent = '\u23F1 ' + formatElapsed(ms);
    b.classList.toggle('timer-running', id === activeTimerId);
  });
}

// Create (and register) a small live-updating time badge for a question id.
function createTimerBadge(id) {
  var badge = document.createElement('span');
  badge.className = 'timer-badge';
  if (!timerBadgeRegistry[id]) timerBadgeRegistry[id] = [];
  timerBadgeRegistry[id].push(badge);
  refreshTimerBadges(id);
  return badge;
}

function stopTimer() {
  if (activeTimerId && activeTimerStart) {
    questionTimers[activeTimerId] = (questionTimers[activeTimerId] || 0) + (Date.now() - activeTimerStart);
    persistTimers();
    var finishedId = activeTimerId;
    activeTimerId = null;
    activeTimerStart = null;
    refreshTimerBadges(finishedId);
  }
  if (timerTickHandle) { clearInterval(timerTickHandle); timerTickHandle = null; }
}

function startTimer(id) {
  if (!id || activeTimerId === id) return;
  stopTimer();
  activeTimerId = id;
  activeTimerStart = Date.now();
  refreshTimerBadges(id);
  timerTickHandle = setInterval(function() {
    if (activeTimerId) refreshTimerBadges(activeTimerId);
  }, 1000);
}

// Zero out a question's accumulated time (used when the timer restarts from scratch).
function resetTimer(id) {
  questionTimers[id] = 0;
  persistTimers();
  refreshTimerBadges(id);
}

document.addEventListener('DOMContentLoaded', function() {
  updateMarkStats();
  var exportBtn = document.getElementById('mark-export-btn');
  var importBtn = document.getElementById('mark-import-btn');
  var importInput = document.getElementById('mark-import-input');
  var clearBtn = document.getElementById('mark-clear-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportMarks);
  if (importBtn) importBtn.addEventListener('click', function() { importInput.click(); });
  if (importInput) importInput.addEventListener('change', function() {
    if (importInput.files && importInput.files[0]) {
      importMarksFromFile(importInput.files[0]);
      importInput.value = '';
    }
  });
  if (clearBtn) clearBtn.addEventListener('click', function() {
    if (confirm('Clear all marks? This cannot be undone (export a backup first if needed).')) {
      questionMarks = {};
      persistMarks();
      refreshAllMarks();
    }
  });
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) stopTimer();
  });
  window.addEventListener('beforeunload', function() { stopTimer(); });
});
</script>

// Returns 'easy' | 'medium' | 'difficult' for a question on a classified paper
// (defaulting unmentioned questions to 'difficult' for examiner-report-sourced
// papers only), or null if that paper has no classification at all.
function getDifficulty(paper, qnum) {
  var m = QUESTION_DIFFICULTY[paper];
  if (m) return m[qnum] || DIFFICULTY_DEFAULT;
  var em = QUESTION_DIFFICULTY_ESTIMATED[paper];
  if (em) return em[qnum] || null;
  return null;
}

// True when a question's rating comes from QUESTION_DIFFICULTY_ESTIMATED
// (a direct read of the question) rather than QUESTION_DIFFICULTY (sourced
// from the Cambridge Examiner Report's own wording).
function isDifficultyEstimated(paper) {
  return !QUESTION_DIFFICULTY[paper] && !!QUESTION_DIFFICULTY_ESTIMATED[paper];
}

function difficultyBadgeHtml(paper, qnum) {
  var d = getDifficulty(paper, qnum);
  if (!d) return '';
  var meta = DIFFICULTY_META[d];
  var estimated = isDifficultyEstimated(paper);
  var cls = 'diff-badge diff-' + d + (estimated ? ' diff-estimated' : '');
  var title = estimated
    ? 'Difficulty (estimated — no examiner report available): ' + meta.label
    : 'Difficulty per Cambridge Examiner Report: ' + meta.label;
  return '<span class="' + cls + '" title="' + title + '">' + meta.label + '</span>';
}

// ---- Build code -> full learning-objective description lookup (used for hover tooltips on knowledge-point chips) ----
const codeDescriptions = {};
syllabus.forEach(function(t) {
  t.subs.forEach(function(s) {
    s.subsubs.forEach(function(ss) {
      codeDescriptions[ss.code] = ss.desc;
    });
  });
});
function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- Build pdf -> all related learning-objective codes map, used to show "also covers" on question cards ----
const pdfToCodes = {};
Object.keys(questionData).forEach(function(code) {
  questionData[code].forEach(function(q) {
    if (!pdfToCodes[q.pdf]) pdfToCodes[q.pdf] = [];
    if (pdfToCodes[q.pdf].indexOf(code) === -1) pdfToCodes[q.pdf].push(code);
  });
});

// ---- Parse a short season+year label (e.g. Jun25) from a paper string like 9702/13/O/N/25 ----
function seasonLabel(paperStr) {
  var parts = paperStr.split('/');
  if (parts.length < 4) return '';
  var year = parts[parts.length - 1];
  var session = parts.slice(2, parts.length - 1).join('/');
  var map = { 'M/J': 'Jun', 'O/N': 'Nov', 'F/M': 'Mar' };
  return (map[session] || session) + year;
}

const container = document.getElementById('syllabus');

syllabus.forEach(function(t) {
  var card = document.createElement('div');
  card.className = 'topic-card t' + t.topic;

  var header = document.createElement('div');
  header.className = 'topic-header';
  header.onclick = function() {
    var closing = card.classList.contains('expanded');
    card.classList.toggle('expanded');
    if (closing) stopTimer();
  };

  var num = document.createElement('div');
  num.className = 'topic-num';
  num.textContent = t.topic;

  var info = document.createElement('div');
  info.className = 'topic-info';
  var subCount = t.subs.length;
  var subsubCount = 0;
  var qPdfSet = new Set();
  for (var i = 0; i < t.subs.length; i++) {
    subsubCount += t.subs[i].subsubs.length;
    for (var m = 0; m < t.subs[i].subsubs.length; m++) {
      var code = t.subs[i].subsubs[m].code;
      var qs = questionData[code] || [];
      for (var n = 0; n < qs.length; n++) {
        qPdfSet.add(qs[n].pdf);
      }
    }
  }
  var qCount = qPdfSet.size;
  var countHtml = subCount + ' sub-topics &middot; ' + subsubCount + ' learning objectives';
  if (qCount > 0) {
    countHtml += ' &middot; <span class="q-count">' + qCount + ' questions</span>';
  }
  info.innerHTML = '<div class="topic-name">' + t.topic + '. ' + t.title + '</div>' +
    '<div class="topic-count">' + countHtml + '</div>';

  var chevron = document.createElement('div');
  chevron.className = 'chevron';
  chevron.innerHTML = '&#9660;';

  header.appendChild(num);
  header.appendChild(info);
  header.appendChild(chevron);

  var subList = document.createElement('div');
  subList.className = 'sub-list';

  for (var j = 0; j < t.subs.length; j++) {
    var s = t.subs[j];
    var subCard = document.createElement('div');
    subCard.className = 'sub-card';

    var subHeader = document.createElement('div');
    subHeader.className = 'sub-header';
    subHeader.innerHTML = '<span class="sub-code">' + s.code + '</span><span class="sub-name">' + s.title + '</span>';

    var subsubList = document.createElement('div');
    subsubList.className = 'subsub-list';

    for (var k = 0; k < s.subsubs.length; k++) {
      var ss = s.subsubs[k];
      var qList = questionData[ss.code] || [];

      var item = document.createElement('div');
      var isSuperHot = qList.length > 10;
      var isHot = qList.length >= 5;
      item.className = 'subsub-item' + (isSuperHot ? ' subsub-item-superhot' : (isHot ? ' subsub-item-hot' : ''));

      var row = document.createElement('div');
      row.className = 'subsub-row';
      var badgeClass = qList.length > 0 ? 'subsub-badge active' : 'subsub-badge';
      if (isSuperHot) badgeClass += ' subsub-badge-superhot';
      else if (isHot) badgeClass += ' subsub-badge-hot';
      var hotIcon = isSuperHot ? '&#128293;&#128293; ' : (isHot ? '&#128293; ' : '');
      row.innerHTML = '<span class="subsub-code">' + ss.code + '</span><span class="subsub-desc">' + ss.desc + '</span><span class="' + badgeClass + '">' + hotIcon + qList.length + '</span>';
      item.appendChild(row);

      if (qList.length > 0) {
        item.classList.add('clickable');

        // Sort by number of related learning objectives, most first
        let sortedQList = qList.slice().sort(function(a, b) {
          var ca = (pdfToCodes[a.pdf] || []).length;
          var cb = (pdfToCodes[b.pdf] || []).length;
          return cb - ca;
        });

        let panel = document.createElement('div');
        panel.className = 'question-panel';

        let qCards = sortedQList.map(function(q) {
          var qCard = document.createElement('div');
          var totalCodes = (pdfToCodes[q.pdf] || []).length;
          var isMulti = totalCodes >= 3;
          qCard.className = 'q-card' + (isMulti ? ' q-card-multi' : '');
          var otherCodes = (pdfToCodes[q.pdf] || []).filter(function(c) { return c !== ss.code; });
          var otherHtml = '';
          if (otherCodes.length > 0) {
            otherHtml = '<div class="q-related">also: ' + otherCodes.map(function(c) {
              return '<span class="q-related-tag">' + c + '</span>';
            }).join('') + '</div>';
          }
          var multiBadge = isMulti ? '<span class="q-tag multi">&#11088; ' + totalCodes + ' topics</span>' : '';
          var diffBadge = difficultyBadgeHtml(q.paper, q.qnum);
          var ans = getAnswer(q.paper, q.qnum);
          var answerRevealHtml = ans
            ? '<span class="answer-letter">' + ans + '</span><span>Correct answer</span>'
            : '<span class="answer-na">No answer data</span>';
          qCard.innerHTML = '<div class="q-meta"><span class="q-tag paper">' + q.paper + '</span><span class="q-tag qnum">' + q.qnum + '</span>' + multiBadge + diffBadge + '</div>' +
            '<div class="q-paper-full">' + q.paper_full + '</div>' +
            otherHtml +
            '<div class="answer-row"><button type="button" class="answer-btn">&#128065; View Answer</button>' +
            '<div class="answer-reveal">' + answerRevealHtml + '</div></div>' +
            '<div class="pdf-container"><embed src="' + q.pdf + '" type="application/pdf">' +
            '<div class="pdf-fallback" style="display:none">📄 Preview unavailable. <a href="' + q.pdf + '" target="_blank">Download PDF</a></div></div>';

          var answerBtn = qCard.querySelector('.answer-btn');
          var answerReveal = qCard.querySelector('.answer-reveal');
          answerBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            var isShown = answerReveal.classList.toggle('shown');
            answerBtn.innerHTML = isShown ? '&#128065; Hide Answer' : '&#128065; View Answer';
            if (isShown) {
              if (activeTimerId === q.pdf) stopTimer();
            } else if (panel.classList.contains('open')) {
              resetTimer(q.pdf);
              startTimer(q.pdf);
            }
          });

          var timerBadge = createTimerBadge(q.pdf);
          qCard.querySelector('.q-meta').appendChild(timerBadge);

          var markToolbar = createMarkToolbar(q.pdf, qCard);
          qCard.querySelector('.q-meta').appendChild(markToolbar);
          registerMarkable(q.pdf, qCard, markToolbar);

          return qCard;
        });

        qCards.forEach(function(c) { panel.appendChild(c); });

        let pageIdx = 0;

        if (qCards.length > 1) {
          let pager = document.createElement('div');
          pager.className = 'q-pager';

          let prevBtn = document.createElement('button');
          prevBtn.className = 'q-pager-btn';
          prevBtn.type = 'button';
          prevBtn.innerHTML = '&#8249;';

          let tabsWrap = document.createElement('div');
          tabsWrap.className = 'q-pager-tabs';
          let tabs = sortedQList.map(function(q, idx) {
            var tab = document.createElement('button');
            var totalCodes = (pdfToCodes[q.pdf] || []).length;
            tab.className = 'q-pager-tab' + (totalCodes >= 3 ? ' q-pager-tab-multi' : '');
            tab.type = 'button';
            tab.innerHTML = '<span class="q-pager-tab-q">' + q.qnum + '</span><span class="q-pager-tab-season">' + seasonLabel(q.paper) + '</span>';
            tab.addEventListener('click', function(e) {
              e.stopPropagation();
              pageIdx = idx;
              renderPage();
            });
            tabsWrap.appendChild(tab);
            return tab;
          });

          let nextBtn = document.createElement('button');
          nextBtn.className = 'q-pager-btn';
          nextBtn.type = 'button';
          nextBtn.innerHTML = '&#8250;';

          const renderPage = function() {
            qCards.forEach(function(c, idx) {
              c.style.display = idx === pageIdx ? 'block' : 'none';
            });
            tabs.forEach(function(tab, idx) {
              tab.classList.toggle('active', idx === pageIdx);
            });
            prevBtn.disabled = pageIdx === 0;
            nextBtn.disabled = pageIdx === qCards.length - 1;
            if (panel.classList.contains('open')) startTimer(sortedQList[pageIdx].pdf);
          };

          prevBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (pageIdx > 0) { pageIdx--; renderPage(); }
          });
          nextBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (pageIdx < qCards.length - 1) { pageIdx++; renderPage(); }
          });

          pager.appendChild(prevBtn);
          pager.appendChild(tabsWrap);
          pager.appendChild(nextBtn);
          panel.insertBefore(pager, panel.firstChild);

          renderPage();
        }


        item.appendChild(panel);
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          var opening = !panel.classList.contains('open');
          panel.classList.toggle('open');
          if (opening) {
            startTimer(sortedQList[pageIdx].pdf);
          } else {
            stopTimer();
          }
        });
      }

      subsubList.appendChild(item);
    }

    subCard.appendChild(subHeader);
    subCard.appendChild(subsubList);
    subList.appendChild(subCard);
  }

  card.appendChild(header);
  card.appendChild(subList);
  container.appendChild(card);
});
</script>

const container2 = document.getElementById('syllabus2');

// Group questions by their assigned topic, preserving the order topics first appear
const topicOrder = [];
const byTopic = {};
paper2Data.forEach(function(q) {
  if (!byTopic[q.topic]) { byTopic[q.topic] = []; topicOrder.push(q.topic); }
  byTopic[q.topic].push(q);
});
topicOrder.sort(function(a, b) { return parseInt(a) - parseInt(b); });

topicOrder.forEach(function(topicNum) {
  var qs = byTopic[topicNum];

  var card = document.createElement('div');
  card.className = 'topic-card t' + topicNum;

  var header = document.createElement('div');
  header.className = 'topic-header';
  header.onclick = function() {
    var closing = card.classList.contains('expanded');
    card.classList.toggle('expanded');
    if (closing) stopTimer();
  };

  var totalMarks = qs.reduce(function(s, q) { return s + q.marks; }, 0);

  var num = document.createElement('div');
  num.className = 'topic-num';
  num.textContent = topicNum;

  var info = document.createElement('div');
  info.className = 'topic-info';
  info.innerHTML = '<div class="topic-name">' + topicNum + '. ' + (topicMeta[topicNum] || '') + '</div>' +
    '<div class="topic-count">' + qs.length + ' question' + (qs.length > 1 ? 's' : '') +
    ' &middot; <span class="q-count">' + totalMarks + ' marks</span></div>';

  var chevron = document.createElement('div');
  chevron.className = 'chevron';
  chevron.innerHTML = '&#9660;';

  header.appendChild(num);
  header.appendChild(info);
  header.appendChild(chevron);

  var subList = document.createElement('div');
  subList.className = 'sub-list';

  qs.forEach(function(q) {
    var qCard = document.createElement('div');
    qCard.className = 'p2-q-card';

    var qHeader = document.createElement('div');
    qHeader.className = 'p2-q-header';
    var p2DiffBadge = difficultyBadgeHtml(q.paper, q.qnum);
    qHeader.innerHTML = '<span class="p2-q-num sub-code">' + q.qnum + '</span>' +
      '<span class="p2-q-title">' + q.title + '</span>' +
      p2DiffBadge +
      '<span class="p2-q-marks">' + q.marks + ' marks</span>' +
      '<span class="p2-chevron">&#9660;</span>';
    qHeader.addEventListener('click', function() {
      var opening = !qCard.classList.contains('expanded');
      qCard.classList.toggle('expanded');
      if (opening) { startTimer(q.pdf); } else { stopTimer(); }
    });

    var timerBadge = createTimerBadge(q.pdf);
    qHeader.insertBefore(timerBadge, qHeader.querySelector('.p2-chevron'));

    var markToolbar = createMarkToolbar(q.pdf, qCard);
    qHeader.insertBefore(markToolbar, qHeader.querySelector('.p2-chevron'));
    registerMarkable(q.pdf, qCard, markToolbar);

    var qMeta = document.createElement('div');
    qMeta.className = 'p2-q-meta';
    qMeta.textContent = q.paper + ' — ' + q.paper_full;

    var qBody = document.createElement('div');
    qBody.className = 'p2-q-body';

    var pdfWrap = document.createElement('div');
    pdfWrap.className = 'p2-pdf-wrap pdf-container';
    pdfWrap.innerHTML = '<embed src="' + q.pdf + '" type="application/pdf">' +
      '<div class="pdf-fallback" style="display:none">📄 Preview unavailable. <a href="' + q.pdf + '" target="_blank">Download PDF</a></div>';
    qBody.appendChild(pdfWrap);

    var partCards = q.parts.map(function(p) {
      var part = document.createElement('div');
      part.className = 'p2-part';

      var codesHtml = p.codes.map(function(c) {
        var desc = codeDescriptions[c];
        var tipAttr = desc ? ' data-tip="' + escapeAttr(desc) + '"' : '';
        return '<span class="p2-code-chip sub-code"' + tipAttr + '>' + c + '</span>';
      }).join('');

      part.innerHTML = '<div class="p2-part-top">' +
        '<span class="p2-part-label">' + p.label + '</span>' +
        '<div class="p2-part-codes">' + codesHtml + '</div>' +
        '<span class="p2-part-marks">[' + p.marks + ']</span>' +
        '</div>' +
        '<button type="button" class="p2-answer-btn">&#128065; View standard answer</button>' +
        '<div class="p2-answer-reveal">' + p.answer + '</div>';

      var btn = part.querySelector('.p2-answer-btn');
      var reveal = part.querySelector('.p2-answer-reveal');
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var shown = reveal.classList.toggle('shown');
        btn.innerHTML = shown ? '&#128065; Hide standard answer' : '&#128065; View standard answer';
        if (shown) {
          if (activeTimerId === q.pdf) stopTimer();
        } else if (qCard.classList.contains('expanded')) {
          resetTimer(q.pdf);
          startTimer(q.pdf);
        }
      });

      return part;
    });

    if (partCards.length > 1) {
      let pageIdx = 0;
      let pager = document.createElement('div');
      pager.className = 'q-pager';

      let prevBtn = document.createElement('button');
      prevBtn.className = 'q-pager-btn';
      prevBtn.type = 'button';
      prevBtn.innerHTML = '&#8249;';

      let tabsWrap = document.createElement('div');
      tabsWrap.className = 'q-pager-tabs';
      let tabs = q.parts.map(function(p, idx) {
        var tab = document.createElement('button');
        tab.className = 'q-pager-tab';
        tab.type = 'button';
        tab.innerHTML = '<span class="q-pager-tab-q">' + p.label + '</span>';
        tab.addEventListener('click', function(e) {
          e.stopPropagation();
          pageIdx = idx;
          renderPage();
        });
        tabsWrap.appendChild(tab);
        return tab;
      });

      let nextBtn = document.createElement('button');
      nextBtn.className = 'q-pager-btn';
      nextBtn.type = 'button';
      nextBtn.innerHTML = '&#8250;';

      const renderPage = function() {
        partCards.forEach(function(c, idx) {
          c.style.display = idx === pageIdx ? 'block' : 'none';
        });
        tabs.forEach(function(tab, idx) {
          tab.classList.toggle('active', idx === pageIdx);
        });
        prevBtn.disabled = pageIdx === 0;
        nextBtn.disabled = pageIdx === partCards.length - 1;
      };

      prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (pageIdx > 0) { pageIdx--; renderPage(); }
      });
      nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (pageIdx < partCards.length - 1) { pageIdx++; renderPage(); }
      });

      pager.appendChild(prevBtn);
      pager.appendChild(tabsWrap);
      pager.appendChild(nextBtn);
      qBody.appendChild(pager);

      renderPage();
    }

    if (partCards.length <= 1) {
      partCards.forEach(function(c) { c.style.display = 'block'; });
    }

    partCards.forEach(function(c) { qBody.appendChild(c); });

    qCard.appendChild(qHeader);
    qCard.appendChild(qMeta);
    qCard.appendChild(qBody);
    subList.appendChild(qCard);
  });

  card.appendChild(header);
  card.appendChild(subList);
  container2.appendChild(card);
});
</script>

<script>
// ============================================================
// DASHBOARD — completion stats for Paper 1 and Paper 2: one
// percentage per complete exam sheet (e.g. 9702/12/M/J/25), plus
// one percentage per topic, shown as small donut-chart tiles.
// "Completed" = marked green (Done) in the question-marking
// system. Re-rendered whenever a mark changes, and whenever the
// dashboard button is opened.
// ============================================================

// Same palette used for the t1..t11 topic-number badges elsewhere on the page.
const TOPIC_COLORS = {
  '1': '#8fa3ad', '2': '#93a382', '3': '#c2a878', '4': '#c08974',
  '5': '#ba8c95', '6': '#9891ab', '7': '#7fa39a', '8': '#a084a0',
  '9': '#c39468', '10': '#a3a578', '11': '#8497a8'
};
const SHEET_COLOR = '#a89e90';

function dashDoneCount(idSet) {
  var done = 0;
  idSet.forEach(function(id) { if (questionMarks[id] === 'green') done++; });
  return done;
}

// Chronological sort key for a paper code like "9702/12/F/M/25":
// by year, then session (Mar < Jun < Nov), then paper variant number.
function paperSortKey(paperStr) {
  var parts = paperStr.split('/');
  var variant = parseInt(parts[1], 10) || 0;
  var year = parseInt(parts[parts.length - 1], 10) || 0;
  var session = parts.slice(2, parts.length - 1).join('/');
  var sessionWeight = { 'F/M': 0, 'M/J': 1, 'O/N': 2 }[session];
  if (sessionWeight === undefined) sessionWeight = 9;
  return year * 100 + sessionWeight * 10 + variant / 100;
}

// A single small donut-chart tile showing a percentage, built with a conic-gradient ring.
function buildDashTile(label, subLabel, tooltip, set, color) {
  var total = set.size;
  if (total === 0) return null;
  var done = dashDoneCount(set);
  var pct = Math.round((done / total) * 100);
  var deg = (pct / 100) * 360;

  var tile = document.createElement('div');
  tile.className = 'dash-tile';
  tile.title = tooltip + ' — ' + done + '/' + total + ' (' + pct + '%)';
  tile.innerHTML =
    '<div class="dash-ring" style="background: conic-gradient(' + color + ' ' + deg + 'deg, #e6ded2 ' + deg + 'deg)">' +
    '<div class="dash-ring-hole"><span class="dash-ring-pct">' + pct + '%</span></div>' +
    '</div>' +
    '<div class="dash-tile-label">' + label + '</div>' +
    (subLabel ? '<div class="dash-tile-sub">' + subLabel + '</div>' : '');
  return tile;
}

function buildDashSection(title, sheets, topics, diffSets) {
  var section = document.createElement('div');
  section.className = 'dash-section';

  var allIds = new Set();
  sheets.forEach(function(sh) { sh.set.forEach(function(id) { allIds.add(id); }); });
  var overallTotal = allIds.size;
  var overallPct = overallTotal > 0 ? Math.round((dashDoneCount(allIds) / overallTotal) * 100) : 0;

  var head = document.createElement('div');
  head.className = 'dash-section-head';
  head.innerHTML = '<span class="dash-section-title">' + title + '</span>' +
    (overallTotal > 0 ? '<span class="dash-section-overall">' + overallPct + '% overall</span>' : '');
  section.appendChild(head);

  if (sheets.length === 0 && topics.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'dash-empty';
    empty.textContent = 'No questions found.';
    section.appendChild(empty);
    return section;
  }

  var sheetsHeading = document.createElement('div');
  sheetsHeading.className = 'dash-subheading';
  sheetsHeading.textContent = 'By exam paper';
  section.appendChild(sheetsHeading);

  var sheetTiles = document.createElement('div');
  sheetTiles.className = 'dash-tiles';
  sheets.forEach(function(sh) {
    var tile = buildDashTile(sh.variant, sh.season, sh.name, sh.set, SHEET_COLOR);
    if (tile) sheetTiles.appendChild(tile);
  });
  section.appendChild(sheetTiles);

  var topicsHeading = document.createElement('div');
  topicsHeading.className = 'dash-subheading';
  topicsHeading.textContent = 'By topic';
  section.appendChild(topicsHeading);

  var topicTiles = document.createElement('div');
  topicTiles.className = 'dash-tiles';
  topics.forEach(function(t) {
    var tile = buildDashTile(t.num, null, t.num + '. ' + (t.name || ''), t.set, TOPIC_COLORS[t.num] || '#8497a8');
    if (tile) topicTiles.appendChild(tile);
  });
  section.appendChild(topicTiles);

  // "By difficulty" — only shown when at least one question has been classified,
  // either from the examiner report or from an estimate (see QUESTION_DIFFICULTY
  // and QUESTION_DIFFICULTY_ESTIMATED above).
  var diffHasAny = diffSets && (diffSets.easy.size + diffSets.medium.size + diffSets.difficult.size) > 0;
  if (diffHasAny) {
    var diffHeading = document.createElement('div');
    diffHeading.className = 'dash-subheading';
    diffHeading.textContent = 'By difficulty (examiner report + estimates)';
    section.appendChild(diffHeading);

    var diffTiles = document.createElement('div');
    diffTiles.className = 'dash-tiles';
    ['easy', 'medium', 'difficult'].forEach(function(key) {
      var meta = DIFFICULTY_META[key];
      var tile = buildDashTile(meta.label, null, meta.label + ' questions', diffSets[key], meta.color);
      if (tile) diffTiles.appendChild(tile);
    });
    section.appendChild(diffTiles);
  }

  return section;
}

function renderDashboard() {
  var el = document.getElementById('dashboard-content');
  if (!el) return;
  el.innerHTML = '';

  var grid = document.createElement('div');
  grid.className = 'dash-grid';
  el.appendChild(grid);

  // ---- Paper 1: one sheet per exam session, one set per topic ----
  var p1SheetSets = {};
  var p1SheetMeta = {};
  syllabus.forEach(function(t) {
    t.subs.forEach(function(s) {
      s.subsubs.forEach(function(ss) {
        (questionData[ss.code] || []).forEach(function(q) {
          if (!p1SheetSets[q.paper]) { p1SheetSets[q.paper] = new Set(); p1SheetMeta[q.paper] = q.paper_full; }
          p1SheetSets[q.paper].add(q.pdf);
        });
      });
    });
  });
  var p1Sheets = Object.keys(p1SheetSets).sort(function(a, b) { return paperSortKey(a) - paperSortKey(b); }).map(function(p) {
    var variant = p.split('/')[1] || '';
    return { variant: variant, season: seasonLabel(p), name: p + ' — ' + p1SheetMeta[p], set: p1SheetSets[p] };
  });
  var p1Topics = syllabus.map(function(t) {
    var set = new Set();
    t.subs.forEach(function(s) {
      s.subsubs.forEach(function(ss) {
        (questionData[ss.code] || []).forEach(function(q) { set.add(q.pdf); });
      });
    });
    return { num: t.topic, name: t.title, set: set };
  });
  var p1DiffSets = { easy: new Set(), medium: new Set(), difficult: new Set() };
  syllabus.forEach(function(t) {
    t.subs.forEach(function(s) {
      s.subsubs.forEach(function(ss) {
        (questionData[ss.code] || []).forEach(function(q) {
          var d = getDifficulty(q.paper, q.qnum);
          if (d) p1DiffSets[d].add(q.pdf);
        });
      });
    });
  });
  grid.appendChild(buildDashSection('Paper 1', p1Sheets, p1Topics, p1DiffSets));

  // ---- Paper 2: one sheet per exam session, one set per topic ----
  var p2SheetSets = {};
  var p2SheetMeta = {};
  var p2TopicSets = {};
  paper2Data.forEach(function(q) {
    if (!p2SheetSets[q.paper]) { p2SheetSets[q.paper] = new Set(); p2SheetMeta[q.paper] = q.paper_full; }
    p2SheetSets[q.paper].add(q.pdf);
    if (!p2TopicSets[q.topic]) p2TopicSets[q.topic] = new Set();
    p2TopicSets[q.topic].add(q.pdf);
  });
  var p2Sheets = Object.keys(p2SheetSets).sort(function(a, b) { return paperSortKey(a) - paperSortKey(b); }).map(function(p) {
    var variant = p.split('/')[1] || '';
    return { variant: variant, season: seasonLabel(p), name: p + ' — ' + p2SheetMeta[p], set: p2SheetSets[p] };
  });
  var p2TopicNums = Object.keys(p2TopicSets).sort(function(a, b) { return parseInt(a) - parseInt(b); });
  var p2Topics = p2TopicNums.map(function(n) {
    return { num: n, name: topicMeta[n], set: p2TopicSets[n] };
  });
  var p2DiffSets = { easy: new Set(), medium: new Set(), difficult: new Set() };
  paper2Data.forEach(function(q) {
    var d = getDifficulty(q.paper, q.qnum);
    if (d) p2DiffSets[d].add(q.pdf);
  });
  grid.appendChild(buildDashSection('Paper 2', p2Sheets, p2Topics, p2DiffSets));
}

document.addEventListener('DOMContentLoaded', renderDashboard);
</script>
