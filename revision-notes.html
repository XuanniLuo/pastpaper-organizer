<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIE AS Physics 9702 - Revision Notes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #e7ebe0;
  color: #5b534c;
  line-height: 1.5;
  padding: 16px;
  max-width: 1000px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d9dfcd;
}
.header h1 {
  font-size: 19px;
  font-weight: 800;
  color: #4a433c;
  margin-bottom: 3px;
}
.header p {
  color: #a89e90;
  font-size: 11.5px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  color: #6b6154;
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 18px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  margin-bottom: 10px;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
}
.back-link:hover {
  background: #f4efe7;
  border-color: #b9c8d1;
  transform: translateY(-1px);
}

/* ---- Sticky nav + search ---- */
.sticky-top {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #e7ebe0;
  padding: 3px 0 8px 0;
}
.nav-pills {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.nav-pill {
  flex: 1;
  text-align: center;
  padding: 8px 8px;
  border-radius: 10px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #6b6154;
  font-size: 11px;
  font-weight: 800;
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s;
}
.nav-pill:hover {
  background: #f4efe7;
  border-color: #b9c8d1;
}
.search-box {
  width: 100%;
  padding: 9px 14px;
  border-radius: 11px;
  border: 1px solid #e6ded2;
  background: #fbf8f4;
  color: #4a433c;
  font-size: 13px;
  outline: none;
  box-shadow: 0 1px 3px rgba(91,83,76,0.08);
}
.search-box:focus {
  border-color: #b9c8d1;
}
.search-meta {
  font-size: 11px;
  color: #a89e90;
  margin-top: 4px;
  padding-left: 4px;
}

/* ---- Section headings ---- */
.section-heading {
  font-size: 14.5px;
  font-weight: 800;
  color: #4a433c;
  margin: 14px 2px 7px 2px;
  display: flex;
  align-items: center;
  gap: 6px;
  scroll-margin-top: 92px;
}
.section-heading:first-of-type {
  margin-top: 2px;
}

/* ---- Topic cards ---- */
.topic-card {
  background: #fbf8f4;
  border-radius: 12px;
  margin-bottom: 7px;
  box-shadow: 0 1px 3px rgba(91,83,76,0.08);
  overflow: hidden;
  border: 1px solid #e6ded2;
}
.topic-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 13px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.topic-header:hover {
  background: #f4efe7;
}
.topic-num {
  width: 27px;
  height: 27px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 800;
  color: white;
  flex-shrink: 0;
}
.topic-info { flex: 1; }
.topic-name {
  font-size: 12.5px;
  font-weight: 700;
  color: #4a433c;
}
.topic-count {
  font-size: 10px;
  color: #a89e90;
  margin-top: 1px;
}
.topic-chevron {
  font-size: 10px;
  color: #a89e90;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.topic-card.open .topic-chevron {
  transform: rotate(90deg);
}
.topic-body {
  display: none;
  padding: 1px 10px 10px 10px;
}
.topic-card.open .topic-body {
  display: block;
}

/* ---- Compact term grid (Definitions) ---- */
.terms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 4px 6px;
}
.term-item {
  border: 1px solid #ebeee2;
  border-radius: 8px;
  background: #fdfbf8;
  overflow: hidden;
  align-self: start;
  transition: border-color 0.2s, background-color 0.2s;
}
.term-item.open {
  border-color: var(--accent-border, #dcd2c2);
  background: var(--accent-bg, #fdfbf8);
  grid-column: 1 / -1;
}
.term-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 6px 9px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.term-head:hover {
  background: #f4efe7;
}
.term-item.open .term-head:hover {
  background: transparent;
}
.term-name {
  font-size: 11.5px;
  font-weight: 700;
  color: #4a433c;
  line-height: 1.25;
}
.term-chevron {
  font-size: 8px;
  color: #c2b9ab;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.term-item.open .term-chevron {
  transform: rotate(90deg);
}
.term-body {
  display: none;
  padding: 0 9px 7px 9px;
  font-size: 11px;
  color: #6b6154;
  line-height: 1.45;
}
.term-body strong {
  color: #4a433c;
  font-weight: 800;
}
.term-item.open .term-body {
  display: block;
}
.term-item.hidden,
.formula-item.hidden {
  display: none;
}
mark {
  background: #f0dfa6;
  color: #4a433c;
  border-radius: 3px;
  padding: 0 2px;
}

/* ---- Formula rows ---- */
.formula-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.formula-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid #ebeee2;
  background: #fdfbf8;
}
.formula-expr {
  font-family: "Cambria Math", Cambria, Georgia, "Times New Roman", serif;
  font-size: 12.5px;
  font-weight: 700;
  color: #4a433c;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 150px;
}
.formula-desc {
  font-size: 11px;
  color: #6b6154;
  line-height: 1.4;
}

/* ---- Nuclide notation ---- */
.nuclide {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
  vertical-align: middle;
}
.nuclide-num {
  display: flex;
  flex-direction: column;
  font-size: 8.5px;
  line-height: 1;
  margin-right: 1px;
}
.nuclide-sym {
  font-size: 12.5px;
  font-weight: 800;
}

/* ---- Graphs ---- */
.graph-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 8px;
}
.graph-item {
  border: 1px solid #ebeee2;
  border-radius: 9px;
  background: #fdfbf8;
  padding: 8px 8px 9px 8px;
}
.graph-svg {
  width: 100%;
  height: auto;
  display: block;
}
.graph-title {
  font-size: 11px;
  font-weight: 800;
  color: #4a433c;
  margin-top: 4px;
}
.graph-note {
  font-size: 10px;
  color: #a89e90;
  margin-top: 2px;
  line-height: 1.4;
}
.no-graph {
  font-size: 11.5px;
  color: #a89e90;
  padding: 6px 2px;
  grid-column: 1 / -1;
}

.no-results {
  text-align: center;
  padding: 22px 10px;
  color: #a89e90;
  font-size: 12px;
  display: none;
}

.footer {
  text-align: center;
  color: #a89e90;
  font-size: 10.5px;
  margin-top: 18px;
  padding-top: 12px;
  border-top: 1px solid #d9dfcd;
}

@media (max-width: 500px) {
  .terms-grid { grid-template-columns: 1fr; }
  .graph-grid { grid-template-columns: 1fr; }
  .formula-item { flex-direction: column; align-items: flex-start; gap: 3px; }
  .formula-expr { min-width: 0; }
}
</style>
</head>

var DEFINITIONS = [

    ["Speed", "A scalar quantity that is a measure of the <strong>rate of change of distance</strong>. The average speed is calculated by dividing the distance travelled by the time taken."],
    ["Velocity", "The <strong>rate of change of displacement</strong>. It is a vector quantity and so has both a direction and a magnitude."],
    ["Velocity-Time Graphs", "Plots showing how velocity changes over a period of time. The <strong>gradient gives acceleration</strong>. Area under line gives displacement. Curved lines represent changing acceleration."]
  ],
  [
    ["Conservation of Momentum", "In a closed system with no external forces the <strong>momentum before an event equals the momentum after</strong> the event."],
    ["Elastic Collision", "When the <strong>kinetic energy before equals the kinetic energy after</strong> an event."],
    ["Force", "The <strong>rate of change of momentum</strong> of an object. The product of the object's mass with its acceleration."],
    ["Inelastic Collision", "When the kinetic energy of a system before an event is <strong>not equal</strong> to the kinetic energy after the event. The kinetic energy has been transferred to other forms."],
    ["Momentum", "The <strong>product of an object's mass and its velocity</strong>."],

    ["Newton's Second Law", "If an object is acted upon by a resultant force it will accelerate. The acceleration is <strong>inversely proportional to the mass</strong> of the object and directly proportional to the force acting upon it."],
    ["Newton's Third Law", "Every action has an <strong>equal and opposite reaction</strong>. If an object exerts a force on another object, then the other object must exert a force back, that is opposite in direction and equal in magnitude."],
    ["Terminal Velocity", "The maximum velocity an object can achieve. It is the point at which <strong>frictional forces and driving forces are balanced</strong> and so no acceleration occurs and the resultant force on the object is 0 N."],
    ["Upthrust", "The <strong>upwards force</strong> that a fluid applies on an object."],
    ["Weight", "The force of gravity on an object, the <strong>product of the object's mass and the acceleration due to gravity</strong>."]
  ],
  [

    ["Centre of Mass", "The single point through which <strong>all the mass</strong> of an object can be said to act."],
    ["Couple", "Two <strong>equal and opposite parallel forces</strong> that act on an object through different lines of action. It has the effect of causing a rotation without translation."],
    ["Density", "The <strong>mass per unit volume</strong> of a material."],
    ["Equilibrium", "For an object to be in equilibrium, both the <strong>resultant force and resultant moment</strong> acting on the object must be equal to zero."],
    ["Hydrostatic Pressure", "<strong>&Delta;p = &rho;g&Delta;h</strong>"],
    ["Moment of Force", "The product of a force and the <strong>perpendicular distance</strong> from the line of action of the force to the pivot."],
    ["Principle of Moments", "For an object to be in equilibrium, the sum of the <strong>clockwise moments</strong> acting about a point must be equal to the sum of the anticlockwise moments acting about the point."],
    ["Pressure", "The force that a surface experiences <strong>per unit area</strong>. It is measured in Pascals (Pa)."],

  [

    ["Gravitational Potential Energy", "The energy gained by an object when it is <strong>raised by a height</strong> in a gravitational field."],
    ["Kinetic Energy", "A form of energy that all moving objects possess. It is directly proportional to the mass of the object, and to the <strong>square of its velocity</strong>."],
    ["Power", "The <strong>rate of transfer of energy</strong>."],
    ["Work Done", "The energy transferred by a force moving over a distance. It is equal to the <strong>product of the magnitudes of the force and distance</strong>."]

  [

    ["Strain", "The <strong>ratio of an object's extension to its original length</strong>. It is a ratio of two lengths and so has no unit."],
    ["Stress", "The amount of force acting <strong>per unit area</strong>. Its unit is the Pascal (Pa)."],
    ["Tension", "The result of two forces acting on an object in <strong>opposite, outwards directions</strong>."],
    ["Tensile Strain", "The extension of an object <strong>divided by its original length</strong>."],
    ["Tensile Stress", "The internal resistance of an object against a force that acts to deform it. It is the <strong>force applied per unit cross-sectional area</strong>."],

  [

    ["Longitudinal Wave", "A wave with oscillations that are <strong>parallel</strong> to the direction of energy propagation. Sound waves are an example of a longitudinal wave."],
    ["Period", "The time it takes for <strong>one complete wave</strong> to pass a given point. It is the inverse of frequency."],
    ["Phase Difference", "The difference in phase between two points on a wave. It is usually expressed in <strong>radians</strong>."],
    ["Polarisation", "The restriction of a wave so that it can only oscillate in a <strong>single plane</strong>. This can only occur for transverse waves."],
    ["Progressive Waves", "A wave that transfers energy from one point to another, <strong>without the transfer of matter</strong>."],
    ["Transverse Waves", "A wave with oscillations that are <strong>perpendicular</strong> to the direction of energy propagation. Electromagnetic waves are examples of transverse waves."],
    ["Wavelength", "The distance between two identical positions on two adjacent waves. It is commonly measured from <strong>peak to peak or trough to trough</strong>."],
    ["Wave Speed", "The <strong>product of a wave's frequency and wavelength</strong>."]

  [

/* ==========================================================
   GRAPHS DATA — classic curve shapes drawn as small SVGs
   ========================================================== */
function P(t, y) {
  var x0 = 32, y0 = 14, w = 194, h = 106;
  return [(x0 + t * w).toFixed(1), (y0 + (1 - y) * h).toFixed(1)];
}
function dot(t, y, color) {
  var p = P(t, y);
  return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="' + color + '" stroke="#fff" stroke-width="1"/>';
}
function dashedLine(t1, y1, t2, y2, color) {
  var a = P(t1, y1), b = P(t2, y2);
  return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="' + color + '" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>';
}
function labelAt(t, y, text, anchor, color) {
  var p = P(t, y);
  return '<text x="' + p[0] + '" y="' + p[1] + '" font-size="7.5" fill="' + (color || '#6b6154') + '" text-anchor="' + (anchor || 'start') + '" font-weight="700">' + text + '</text>';
}
function pathFromPoints(pts) {
  var x0 = 32, y0 = 14, w = 194, h = 106;
  var d = '';
  pts.forEach(function(p, i) {
    var px = x0 + p[0] * w;
    var py = y0 + (1 - p[1]) * h;
    d += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1) + ' ';
  });
  return d;
}
function sampledPath(fn, n) {
  n = n || 50;
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var t = i / n;
    pts.push([t, fn(t)]);
  }
  return pathFromPoints(pts);
}
function axesSvg() {
  var x0 = 32, y0 = 14, w = 194, h = 106;
  var xEnd = x0 + w, yEnd = y0 + h;
  return '<line x1="' + x0 + '" y1="' + yEnd + '" x2="' + (xEnd + 6) + '" y2="' + yEnd + '" stroke="#a89e90" stroke-width="1.2"/>'
    + '<polygon points="' + (xEnd + 6) + ',' + yEnd + ' ' + xEnd + ',' + (yEnd - 3) + ' ' + xEnd + ',' + (yEnd + 3) + '" fill="#a89e90"/>'
    + '<line x1="' + x0 + '" y1="' + yEnd + '" x2="' + x0 + '" y2="' + (y0 - 6) + '" stroke="#a89e90" stroke-width="1.2"/>'
    + '<polygon points="' + x0 + ',' + (y0 - 6) + ' ' + (x0 - 3) + ',' + y0 + ' ' + (x0 + 3) + ',' + y0 + '" fill="#a89e90"/>';
}
function axisLabels(xLabel, yLabel) {
  return '<text x="234" y="132" font-size="8.5" fill="#6b6154" text-anchor="end" font-weight="700">' + xLabel + '</text>'
    + '<text x="5" y="12" font-size="8.5" fill="#6b6154" text-anchor="start" font-weight="700">' + yLabel + '</text>';
}
function graphSvg(spec, color) {
  var inner = axesSvg() + axisLabels(spec.xLabel, spec.yLabel);
  if (spec.fn) {
    inner += '<path d="' + sampledPath(spec.fn, spec.samples || 50) + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>';
  }
  if (spec.extra) inner += spec.extra(color);
  return '<svg viewBox="0 0 240 145" class="graph-svg">' + inner + '</svg>';
}

var feFn = function(t) {
  if (t <= 0.55) return 0.8 * (t / 0.55);
  if (t <= 0.85) { var u = (t - 0.55) / 0.3; return 0.8 + 0.15 * Math.sin(u * Math.PI / 2); }
  var v = (t - 0.85) / 0.15; return 0.95 - 0.20 * v;
};

/* ==========================================================
   SHARED TOPIC CARD BUILDER
   ========================================================== */
function createTopicCard(ti, countText) {
  var color = TOPIC_COLORS[ti % TOPIC_COLORS.length];
  var card = document.createElement('div');
  card.className = 'topic-card';
  var header = document.createElement('div');
  header.className = 'topic-header';
  header.innerHTML =
    '<div class="topic-num" style="background:' + color + '">' + (ti + 1) + '</div>' +
    '<div class="topic-info">' +
      '<div class="topic-name">' + TOPIC_NAMES[ti] + '</div>' +
      '<div class="topic-count">' + countText + '</div>' +
    '</div>' +
    '<div class="topic-chevron">&#9656;</div>';
  header.addEventListener('click', function() {
    card.classList.toggle('open');
  });
  card.appendChild(header);
  var body = document.createElement('div');
  body.className = 'topic-body';
  card.appendChild(body);
  return { card: card, body: body, color: color };
}

/* ---- Build Definitions section ---- */
function buildDefinitionsSection() {
  var container = document.getElementById('definitions-container');
  DEFINITIONS.forEach(function(terms, ti) {
    var tc = createTopicCard(ti, terms.length + ' definitions');
    var grid = document.createElement('div');
    grid.className = 'terms-grid';

    terms.forEach(function(pair) {
      var item = document.createElement('div');
      item.className = 'term-item';
      item.dataset.term = pair[0].toLowerCase();
      item.dataset.def = pair[1].replace(/<[^>]+>/g, '').toLowerCase();
      item.dataset.color = tc.color;

      var thead = document.createElement('div');
      thead.className = 'term-head';
      thead.innerHTML = '<span class="term-name">' + pair[0] + '</span><span class="term-chevron">&#9656;</span>';
      thead.addEventListener('click', function() {
        var isOpen = item.classList.toggle('open');
        if (isOpen) {
          item.style.setProperty('--accent-bg', hexToRgba(tc.color, 0.13));
          item.style.setProperty('--accent-border', hexToRgba(tc.color, 0.45));
        } else {
          item.style.removeProperty('--accent-bg');
          item.style.removeProperty('--accent-border');
        }
      });

      var tbody = document.createElement('div');
      tbody.className = 'term-body';
      tbody.innerHTML = pair[1];

      item.appendChild(thead);
      item.appendChild(tbody);
      grid.appendChild(item);
    });

    tc.body.appendChild(grid);
    container.appendChild(tc.card);
  });
}

/* ---- Build Formulas section ---- */
function buildFormulasSection() {
  var container = document.getElementById('formulas-container');
  FORMULAS.forEach(function(list, ti) {
    var tc = createTopicCard(ti, list.length + ' formulas');
    var wrap = document.createElement('div');
    wrap.className = 'formula-list';

    list.forEach(function(pair) {
      var item = document.createElement('div');
      item.className = 'formula-item';
      item.dataset.expr = pair[0].replace(/<[^>]+>/g, '').toLowerCase();
      item.dataset.desc = pair[1].toLowerCase();
      item.innerHTML = '<span class="formula-expr">' + pair[0] + '</span><span class="formula-desc">' + pair[1] + '</span>';
      wrap.appendChild(item);
    });

    tc.body.appendChild(wrap);
    container.appendChild(tc.card);
  });
}

          '<div class="graph-title">' + spec.title + '</div>' +
          (spec.note ? '<div class="graph-note">' + spec.note + '</div>' : '');
        wrap.appendChild(item);
      });
    }

    tc.body.appendChild(wrap);
    container.appendChild(tc.card);
  });
}

buildDefinitionsSection();
buildFormulasSection();
buildGraphsSection();

/* ==========================================================
   GLOBAL SEARCH across Definitions + Formulas (+ Graph titles)
   ========================================================== */
var searchBox = document.getElementById('search-box');
var searchMeta = document.getElementById('search-meta');
var noResults = document.getElementById('no-results');

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlightText(el, query) {
  var original = el.dataset.orig || el.textContent;
  el.dataset.orig = original;
  if (!query) {
    el.textContent = original;
    return;
  }
  var re = new RegExp('(' + escapeRegExp(query) + ')', 'ig');
  el.innerHTML = original.replace(re, '<mark>$1</mark>');
}

searchBox.addEventListener('input', function() {
  var q = searchBox.value.trim().toLowerCase();
  var total = 0;

  document.querySelectorAll('#definitions-container .topic-card, #formulas-container .topic-card').forEach(function(card) {
    var items = card.querySelectorAll('.term-item, .formula-item');
    var any = false;

    items.forEach(function(item) {
      var hay = (item.dataset.term || '') + ' ' + (item.dataset.def || '') + ' ' + (item.dataset.expr || '') + ' ' + (item.dataset.desc || '');
      var matches = !q || hay.indexOf(q) !== -1;
      item.classList.toggle('hidden', !matches);

      if (matches) {
        any = true;
        total++;
        if (item.classList.contains('term-item')) {
          if (q) {
            item.classList.add('open');
            item.style.setProperty('--accent-bg', hexToRgba(item.dataset.color, 0.13));
            item.style.setProperty('--accent-border', hexToRgba(item.dataset.color, 0.45));
            highlightText(item.querySelector('.term-name'), q);
          } else {
            item.classList.remove('open');
            item.style.removeProperty('--accent-bg');
            item.style.removeProperty('--accent-border');
            highlightText(item.querySelector('.term-name'), '');
          }
        }
      }
    });

    card.style.display = any ? '' : 'none';
    if (q && any) card.classList.add('open');
    else if (!q) card.classList.remove('open');
  });

  document.querySelectorAll('#graphs-container .topic-card').forEach(function(card) {
    var items = card.querySelectorAll('.graph-item');
    var any = false;
    items.forEach(function(item) {
      var t = item.querySelector('.graph-title');
      var text = t ? t.textContent.toLowerCase() : '';
      if (!q) {
        item.style.display = '';
        any = true;
        return;
      }
      var matches = text.indexOf(q) !== -1;
      item.style.display = matches ? '' : 'none';
      if (matches) { any = true; total++; }
    });
    if (items.length === 0) any = !q;
    card.style.display = any ? '' : 'none';
    if (q && any) card.classList.add('open');
    else if (!q) card.classList.remove('open');
  });

  noResults.style.display = (q && total === 0) ? 'block' : 'none';
  searchMeta.textContent = q ? (total + ' result' + (total === 1 ? '' : 's') + ' found') : '';
});
</script>
